@if(!hasPermission){

<p>

    Se necesita permiso para acceder a la cámara.

</p>

}

@if(cameras.length > 1){

<select
    [value]="currentCamera"
    (change)="currentCamera = cameras[$any($event.target).selectedIndex]">

    @for(camera of cameras; track camera.deviceId){

        <option>

            {{ camera.label || 'Cámara' }}

        </option>

    }

</select>

<br><br>

}

<zxing-scanner

    [device]="currentCamera"

    (camerasFound)="onCamerasFound($event)"

    (permissionResponse)="onPermissionResponse($event)"

    (scanSuccess)="onScanSuccess($event)">

</zxing-scanner>

<div class="divider">

    <span>

        o

    </span>

</div>

<button
    class="image-button"
    type="button"
    (click)="selectImage()"
    [disabled]="loadingImage">

    @if(!loadingImage){

        🖼️ Elegir una imagen

    }@else{

        ⏳ Analizando imagen...

    }

</button>

<input
    #imageInput
    type="file"
    accept="image/*"
    hidden
    (change)="onImageSelected($event)">
